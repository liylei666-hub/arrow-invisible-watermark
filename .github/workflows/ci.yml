name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: decode smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Embed/decode smoke and accept gate
        run: python ci_smoke.py
